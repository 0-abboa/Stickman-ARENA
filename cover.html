<script>
// Cover mode: two PROFESSIONAL bots fight, no menus, no health bars.
// Space pauses the frame (for screenshots); Space again resumes.
window.addEventListener('load', () => setTimeout(() => {
    const g = window.game;
    if (!g) return;
    ['main-menu', 'hud', 'pause-menu', 'mobile-controls', 'btn-pause-mobile'].forEach(id => {
        const el = document.getElementById(id); if (el) el.style.display = 'none';
    });
    document.querySelectorAll('.credits').forEach(el => el.style.display = 'none');
    // Health bars off: the overhead bar is the only per-fighter HUD drawn in the world
    Player.prototype.drawOverhead = function () {};
    AudioSys.muteSfx = true;
    g.demo = true;
    g.state = 'MENU';
    g.countdownEnd = 0;
    const red = new Bot(0, 100, 100, 'nightmare', 0), blue = new Bot(1, 300, 100, 'nightmare', 1);
    red.color = red.originalColor = '#e53935';    // one red
    blue.color = blue.originalColor = '#1e88e5';  // one blue
    g.players = [red, blue];
    g.kingId = null;
    g.levelNum = 1 + Math.floor(Math.random() * 4);
    g.startLevel();
    // Pause: the world stops advancing while the last frame stays on screen
    let paused = false;
    const tick = g.tick.bind(g);
    g.tick = (n) => { if (paused) { g.lastTick = performance.now(); return; } tick(n); };
    window.addEventListener('keydown', (e) => {
        if (e.code !== 'Space') return;
        e.preventDefault();
        if (!e.repeat) paused = !paused;
    });
}, 60));
</script>
